<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabbit Hole</title>
<meta name="theme-color" content="#5b3a29">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a href="#/" class="brand"><img src="/icon.svg" alt="" width="28" height="28"> Rabbit Hole</a>
  <form class="search" id="searchForm" role="search">
    <input type="search" name="q" id="searchBox" placeholder="Search your research…" aria-label="Search your research">
  </form>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view" aria-live="polite"></main>

<div id="player" class="player" hidden>
  <div class="player-now">
    <div class="player-title" id="playerTitle"></div>
    <div class="player-sub" id="playerSub"></div>
    <div class="player-bar"><div id="playerProgress"></div></div>
  </div>
  <div class="player-controls">
    <button id="pPrev" title="Previous paragraph" aria-label="Previous paragraph">⏮</button>
    <button id="pPlay" class="big" title="Play / pause" aria-label="Play or pause">⏸</button>
    <button id="pNext" title="Next paragraph" aria-label="Next paragraph">⏭</button>
    <button id="pSettings" title="Voice and speed" aria-label="Voice and speed">⚙︎</button>
    <button id="pClose" title="Stop" aria-label="Stop">✕</button>
  </div>
  <div class="player-settings" id="playerSettings" hidden>
    <label>Speed <select id="pRate">
      <option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option>
      <option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option><option value="2">2×</option>
    </select></label>
    <label>Voice <select id="pVoice"></select></label>
    <label class="check"><input type="checkbox" id="pOriginal"> Read the original language instead</label>
  </div>
</div>

<input type="file" id="shotInput" accept="image/*" multiple hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
